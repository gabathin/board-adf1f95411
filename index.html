 Morning Board — weather live from Open-Meteo in the browser; private items from data.json (rebuilt each morning by build_data.py).
 Deep links:
  weather://  — best-effort; Apple publishes no official URL scheme for Weather. Falls back to weather.com.

function mapsLinks(a,d){a.href='comgooglemaps://?daddr='+encodeURIComponent(d).replace(/%20/g,'+')+'&directionsmode=driving';
 a.dataset.fallback='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(d)+'&travelmode=driving'}
function renderData(J){
 $('kicker').textContent='Morning Board · '+(J.dayType||'Today');$('when').textContent=J.dateLabel||'';
 $('stxt').textContent=J.status||'Up to date';
 const L=J.leave||{},a=$('leave');
 if(L.dest){a.dataset.dest=L.dest;mapsLinks(a,L.dest);a.setAttribute('aria-label','Directions to '+L.destName);
  $('lk').textContent='Leave by';$('lbig').textContent=L.leaveBy;$('lm').innerHTML=esc(L.line1)+' · <span class="cnt" data-to="'+(+L.driveMin)+'">0</span> min drive<br>'+esc(L.line2||'');
  $('lroute').hidden=false;$('lto').textContent=L.toShort||'';}
 else{a.href='https://www.google.com/maps';a.removeAttribute('data-fallback');a.setAttribute('aria-label','Open Google Maps');
  $('lk').textContent='Travel';$('lbig').textContent='No travel today';$('lbig').style.fontSize='22px';$('lm').textContent=L.note||'Nothing on the calendar with a location.';}
 $('items').innerHTML=(J.items||[]).map(it=>'<a class="item tap" href="'+esc(it.href)+'"'+(it.fallback?' data-fallback="'+esc(it.fallback)+'"':'')+'><div class="ic '+(it.color||'cyan')+'" style="color:'+(it.color==='amber'?'#fcd34d':'#67e8f9')+'">'+(IC[it.icon]||IC.mail)+'</div><div class="tx"><div class="it">'+esc(it.title)+'</div><div class="id">'+esc(it.sub)+'</div></div>'+(it.tag?'<span class="tag '+(it.color||'cyan')+'">'+esc(it.tag)+'</span>':'')+'</a>').join('')
  ||'<div class="item"><div class="tx"><div class="it">Nothing new overnight</div><div class="id">No packages or notable mail</div></div></div>';
 $('fl').textContent='GABRIEL OLIVEIRA';$('fr').textContent='UPDATED '+(J.updatedLabel||'').toUpperCase();}
function bindFallbacks(){document.querySelectorAll('a[data-fallback]').forEach(a=>{if(a._fb)return;a._fb=1;a.addEventListener('click',()=>{
 const fb=a.dataset.fallback;if(!fb)return;let hid=false;const h=()=>{if(document.hidden)hid=true};document.addEventListener('visibilitychange',h);
 window.addEventListener('pagehide',()=>hid=true,{once:true});
 setTimeout(()=>{document.removeEventListener('visibilitychange',h);if(!hid&&!document.hidden)location.href=fb},1500);})})}
document.addEventListener('touchstart',e=>{const t=e.target.closest('.tap');if(t)t.classList.add('pressed')},{passive:true});
document.addEventListener('touchend',()=>document.querySelectorAll('.pressed').forEach(x=>x.classList.remove('pressed')),{passive:true});
function routeAnim(){const p=$('rpath'),d=$('rdot');if($('lroute').hidden)return;const L=p.getTotalLength();const s=performance.now()+500;
 (function f(n){const t=(n-s)/1000;
  if(t<1.4){p.style.strokeDashoffset=Math.max(0,1-ease(Math.max(0,t/1.4)));}
  else{p.style.strokeDashoffset=0;if(!RM){const u=((t-1.4)%2.8)/2.8;const pt=p.getPointAtLength(u*L);d.setAttribute('cx',pt.x);d.setAttribute('cy',pt.y);d.setAttribute('opacity',Math.sin(u*Math.PI).toFixed(2));}}
  requestAnimationFrame(f)})(performance.now());}
function animateIn(){document.querySelectorAll('.cnt').forEach(e=>count(e,+e.dataset.to,1500,300));count(ht,+ht.dataset.to,1500,200);
 setTimeout(()=>{$('arc').style.strokeDashoffset=0},450);routeAnim();
 setTimeout(()=>document.querySelectorAll('.cnt,#htemp').forEach(e=>{if(e.textContent!==String(e.dataset.to))e.textContent=e.dataset.to}),4000)}
const tmo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
const dataP=tmo(fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}),6000).catch(()=>null);
const wxP=tmo(fetch(OM,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}),6000).then(build).catch(()=>null);
Promise.all([dataP,wxP]).then(([J,live])=>{
 if(J)renderData(J);else{$('stxt').textContent='Offline';$('items').innerHTML='<div class="item"><div class="tx"><div class="it">Couldn’t load today’s briefing</div><div class="id">Pull to refresh</div></div></div>';$('lbig').textContent='—'}
 if(live){WX=live;$('wsrc').textContent='Live · Open-Meteo · tap an hour'}
 else if(J&&J.weather){try{WX=build(J.weather.raw);$('wsrc').textContent='As of '+J.weather.asOf+' (offline)';$('wsrc').classList.add('stale')}catch(e){}}
 if(WX)setLoc(loc,true);else{$('wdesc').textContent='Weather unavailable right now.'}
 bindFallbacks();requestAnimationFrame(()=>setTimeout(animateIn,150));
});
