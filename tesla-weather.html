<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Weather card concept v3</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 30% 0%,#1b2a44,#070b14 70%);font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#fff;padding:max(18px,env(safe-area-inset-top)) 14px 30px}
h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin:6px 4px 12px;font-weight:600}
.card{background:#0a1020;position:relative;width:100%;max-width:400px;height:240px;margin:0 auto;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);isolation:isolate}
.sky{position:absolute;inset:0}
.sun .sky{background:linear-gradient(160deg,rgba(64,120,190,.55),rgba(25,45,80,.5))}
.night .sky{background:linear-gradient(160deg,rgba(10,16,34,.92),rgba(14,24,46,.75))}
.rain .sky,.hail .sky{background:linear-gradient(160deg,rgba(48,60,76,.75),rgba(24,32,44,.7))}
.storm .sky{background:linear-gradient(160deg,rgba(22,26,36,.9),rgba(34,40,52,.8))}
.snow .sky{background:linear-gradient(160deg,rgba(170,184,204,.62),rgba(90,104,128,.6))}
.heavysnow .sky{background:linear-gradient(160deg,rgba(196,204,216,.75),rgba(120,132,150,.68))}
.sleet .sky{background:linear-gradient(160deg,rgba(70,84,104,.72),rgba(32,42,58,.7))}
.card.n .sky{background:linear-gradient(160deg,rgba(8,13,32,.94),rgba(16,26,50,.84))}.card.n.storm .sky{background:linear-gradient(160deg,rgba(6,8,16,.96),rgba(14,18,30,.9))}.card.n.fog .sky{background:linear-gradient(160deg,rgba(30,36,54,.92),rgba(22,28,44,.86))}.card.n.heavysnow .sky,.card.n.snow .sky{background:linear-gradient(160deg,rgba(26,34,62,.92),rgba(36,46,76,.84))}
.fog .sky{background:linear-gradient(160deg,rgba(100,110,124,.65),rgba(54,62,74,.65))}
.wind .sky{background:linear-gradient(160deg,rgba(70,110,150,.55),rgba(30,46,70,.55))}
canvas{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;left:18px;top:16px;display:flex;flex-direction:column;z-index:3;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.t{font-size:60px;font-weight:200;letter-spacing:-.03em;line-height:1}
.c{font-size:16px;font-weight:600;margin-top:6px}.hl{font-size:13px;opacity:.85;margin-top:2px}
.loc{position:absolute;right:12px;top:12px;z-index:3;display:flex;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:99px;padding:3px;border:1px solid rgba(255,255,255,.15)}
.loc button{all:unset;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;opacity:.7;cursor:pointer}
.loc button.on{background:rgba(255,255,255,.22);opacity:1}
.lbl{max-width:400px;margin:14px auto 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:400px;margin:8px auto 0}
.chips button{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);-webkit-tap-highlight-color:transparent}
.chips button.on{background:#fff;color:#0b1220}
#tl.on{background:#ffd86a;color:#1a1200}
.trow{display:flex;align-items:center;gap:10px;max-width:400px;margin:10px auto 0;padding:0 6px}.trow input{flex:1;accent-color:#ffd86a}.trow span{font-size:13px;font-weight:600;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}#play.on{background:#ffd86a;color:#1a1200}
.note{max-width:400px;margin:14px auto;font-size:12px;opacity:.55;text-align:center}
</style></head><body>
<h1>Weather · concept v3</h1>
<div class="card sun" id="card"><div class="sky"></div><canvas id="cv"></canvas>
 <div class="ov"><div class="t" id="tmp">--°</div><div class="c" id="cond">—</div><div class="hl" id="hl">H — · L —</div></div>
 <div class="loc"><button class="on" data-loc="0">Litchfield</button><button data-loc="1">New Haven</button></div>
</div>
<div class="lbl">Time of day</div>
<div class="chips" id="tchips"><button data-t="auto" class="on">Auto</button><button data-t="day">Day</button><button data-t="night">Night</button><button id="play">▶ Play day</button></div><div class="trow"><input type="range" id="tsl" min="0" max="1439" step="1" value="720" aria-label="Time of day"><span id="tval">--</span></div>
<div class="lbl">Weather</div>
<div class="chips" id="wchips"><button data-s="live" class="on">Live</button><button data-s="sun">Clear</button><button data-s="drizzle">Drizzle</button><button data-s="rain">Rain</button><button data-s="snow">Snow</button><button data-s="heavysnow">Heavy snow</button><button data-s="sleet">Sleet</button><button data-s="fog">Fog</button><button data-s="hail">Hail</button><button data-s="wind">Wind</button><button data-s="storm">Storm</button></div>
<div class="lbl">Season</div>
<div class="chips" id="schips"><button data-d="today" class="on">Today</button><button data-d="04-12">Spring</button><button data-d="07-10">Summer</button><button data-d="10-02">Early fall</button><button data-d="10-24">Peak fall</button><button data-d="11-12">Late fall</button><button data-d="11-26">Bare</button><button data-d="12-15">Christmas</button><button data-d="01-20">Winter pine</button></div>
<div class="chips" id="xchips"><button id="santa">Santa</button><button id="pres">Presents: Auto</button></div>
<div class="chips" id="cchips"><button data-c="" class="on">Car: Live</button><button data-c="cold">Cabin cold</button><button data-c="warming">Warming (defrost)</button><button data-c="warm">Warm</button><button data-c="asleep">Asleep</button></div>
<div class="chips"><button id="tl">Fast snow</button><button id="rs">Reset snow</button><button id="ice">Icicles: Auto</button></div>

const KE=[[-120,'#050a1a','#0a1430','#101c3c'],[-60,'#0a1230','#141c44','#1e2650'],[-30,'#101a48','#26306a','#4a4a80'],[-12,'#1c2058','#7a3a78','#d8607a'],[0,'#2a3070','#b0507a','#ff7a3a'],[15,'#3a4a8a','#c07890','#ff9a50'],[60,'#4a74b4','#a0a8c0','#f4c88a'],[150,'#3a78c4','#6aa4dc','#e8dcc0'],[240,'#2f78d0','#5aa0e6','#a8d0f4']];
function kf(K,d){const L=K.length;if(d<=K[0][0])return K[0].slice(1).map(hx);for(let i=1;i<L;i++)if(d<=K[i][0]){const t=sm((d-K[i-1][0])/(K[i][0]-K[i-1][0]));return[1,2,3].map(j=>{const a=hx(K[i-1][j]),b=hx(K[i][j]);return a.map((v,k)=>v+(b[k]-v)*t)})}return K[L-1].slice(1).map(hx)}
const WF={drizzle:.42,sun:0,night:0,wind:.12,fog:.68,rain:.66,hail:.68,sleet:.68,storm:.8,snow:.58,heavysnow:.72},BF={drizzle:.9,rain:.7,hail:.72,sleet:.72,storm:.48,snow:1.08,heavysnow:1.15};
const wfac=()=>(WF[scene]||0)+(PARTLY&&(scene==='sun'||scene==='night')?.22:0);
function updTime(fromRender){const T=curMin(),{rise,set}=SUNT,morn=T<(rise+set)/2,d=morn?T-rise:set-T;
 Object.assign(SKY,{T,d,morn,sunF:(T-rise)/(set-rise),moonF:((T-set+1440)%1440)/(rise+1440-set)});SKY.sunE=Math.max(0,Math.sin(Math.PI*clamp(SKY.sunF,0,1)))*(SKY.sunF>0&&SKY.sunF<1?1:0);
 SKY.warm=d>-30?Math.exp(-(((d-12)/38)**2))*(morn?.8:1):0;SKY.starF=sm(clamp((-d-30)/40,0,1));
 const n=d<-32;SKY.cool=!n&&d<5?sm(clamp((5-d)/37,0,1)):0;
 const sl=document.getElementById('tsl'),tv=document.getElementById('tval'),rv=Math.round(T)%1440;if(+sl.value!==rv)sl.value=rv;const ft=fmt(T);if(tv.textContent!==ft)tv.textContent=ft;
 updAstro(T);
 if(fromRender){NIGHT=n;return}if(n!==NIGHT){NIGHT=n;render()}else paintSky()}
function paintSky(){const c=kf(SKY.morn?KM:KE,SKY.d),wf=wfac(),b=BF[scene]||1;
 const cols=c.map(v=>{const l=v[0]*.3+v[1]*.55+v[2]*.15,tg=[l*b*.94,l*b*.98,l*b*1.06];return v.map((x,k)=>clamp(Math.round(x+(tg[k]-x)*wf),0,255))});
 SKY.top=cols[0];SKY.mid=cols[1];const st=`linear-gradient(180deg,rgb(${cols[0]}) 0%,rgb(${cols[1]}) 58%,rgb(${cols[2]}) 100%)`;if(st!==skyStr){skyStr=st;card.querySelector('.sky').style.background=st}}

const RD=Math.PI/180,J0=2440588,J2=2451545,OBL=RD*23.4397;
const jd=ms=>ms/864e5-.5+J0-J2,dcl=(l,b)=>Math.asin(Math.sin(b)*Math.cos(OBL)+Math.cos(b)*Math.sin(OBL)*Math.sin(l)),rasc=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(OBL)-Math.tan(b)*Math.sin(OBL),Math.cos(l));
const sid=(d,lw)=>RD*(280.16+360.9856235*d)-lw,azm=(H,ph,de)=>Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(ph)-Math.tan(de)*Math.cos(ph)),alt_=(H,ph,de)=>Math.asin(Math.sin(ph)*Math.sin(de)+Math.cos(ph)*Math.cos(de)*Math.cos(H));
function sunC(d){const M=RD*(357.5291+.98560028*d),C=RD*(1.9148*Math.sin(M)+.02*Math.sin(2*M)+.0003*Math.sin(3*M)),L=M+C+RD*102.9372+Math.PI;return{dec:dcl(L,0),ra:rasc(L,0)}}
function moonC(d){const L=RD*(218.316+13.176396*d),M=RD*(134.963+13.064993*d),F=RD*(93.272+13.22935*d),l=L+RD*6.289*Math.sin(M),b=RD*5.128*Math.sin(F);return{ra:rasc(l,b),dec:dcl(l,b),dist:385001-20905*Math.cos(M)}}
function sunPos(ms,lat,lon){const d=jd(ms),c=sunC(d),H=sid(d,-lon*RD)-c.ra;return{alt:alt_(H,lat*RD,c.dec)/RD,az:azm(H,lat*RD,c.dec)/RD+180}}
function moonPos(ms,lat,lon){const d=jd(ms),c=moonC(d),H=sid(d,-lon*RD)-c.ra;let h=alt_(H,lat*RD,c.dec);const hh=Math.max(h,0);h+=.0002967/Math.tan(hh+.00312536/(hh+.08901179));return{alt:h/RD,az:azm(H,lat*RD,c.dec)/RD+180}}
function moonIl(ms){const d=jd(ms),s=sunC(d),m=moonC(d),SD=149598000,phi=Math.acos(Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra)),inc=Math.atan2(SD*Math.sin(phi),m.dist-SD*Math.cos(phi)),an=Math.atan2(Math.cos(s.dec)*Math.sin(s.ra-m.ra),Math.sin(s.dec)*Math.cos(m.dec)-Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra));return{fr:(1+Math.cos(inc))/2,phase:.5+.5*inc*(an<0?-1:1)/Math.PI}}
function phaseName(ph,fr){if(fr<.03)return'New moon';if(fr>.97)return'Full moon';const w=ph<.5;if(Math.abs(fr-.5)<.06)return w?'First quarter':'Last quarter';return(w?'Waxing ':'Waning ')+(fr<.5?'crescent':'gibbous')}
function simMs(T){return Date.UTC(simDate.getFullYear(),simDate.getMonth(),simDate.getDate())+(T-nyOff(new Date(Date.UTC(simDate.getFullYear(),simDate.getMonth(),simDate.getDate(),17)))*60)*6e4}
let SUNP={alt:30,az:180},MOON=null,mrsK='',MRS=null;
function moonRS(ms,lat,lon){const k=Math.round(ms/6e5)+'|'+lat;if(k===mrsK)return MRS;mrsK=k;const h0=.125,up=t=>{const d=jd(t),c=moonC(d);return alt_(sid(d,-lon*RD)-c.ra,lat*RD,c.dec)/RD>h0},bs=(lo,hi)=>{const u=up(lo);while(hi-lo>3e4){const m=(lo+hi)/2;if(up(m)===u)lo=m;else hi=m}return(lo+hi)/2};let a=ms,b=ms;for(let i=0;i<160&&up(a);i++)a-=6e5;for(let i=0;i<160&&up(b);i++)b+=6e5;if(a<ms)a=bs(a,a+6e5);if(b>ms)b=bs(b-6e5,b);MRS={rise:a,set:b};return MRS}
function updAstro(T){const[la,lo]=LL[loc],ms=simMs(T);SUNP=sunPos(ms,la,lo);const mp=moonPos(ms,la,lo),il=moonIl(ms);MOON={...mp,...il,f:.5};if(mp.alt>-.3){const r=moonRS(ms,la,lo);MOON.f=(ms-r.rise)/Math.max(1,r.set-r.rise)}}
const ALTMAX=72;function altY(a){const top=H*.17,hor=H*.62;return a>=0?hor-(hor-top)*Math.min(a,ALTMAX)/ALTMAX:hor-a/6*(H*.45)}
function pathPt(f){const k=W/400,p=[[22*k,H+6],[118*k,H*.62],[162*k,H*.42],[180*k,H*.17],[256*k,H*.24],[330*k,H*.37],[W-20,H*.46]],out=Math.max(0,-f,f-1);f=clamp(f,0,1)*6;const i=Math.min(5,Math.floor(f)),t=f-i,A=p[Math.max(0,i-1)],B=p[i],C=p[i+1],D=p[Math.min(6,i+2)];
 const r=[0,1].map(j=>.5*(2*B[j]+(-A[j]+C[j])*t+(2*A[j]-5*B[j]+4*C[j]-D[j])*t*t+(-A[j]+3*B[j]-3*C[j]+D[j])*t*t*t));r[1]+=out*900;return r}
const SUNC=[[0,'#ff4a1c'],[.18,'#ff8a2e'],[.42,'#ffd27a'],[.75,'#fff3c4'],[1,'#fff6d8']];
function sunCol(e){for(let i=1;i<SUNC.length;i++)if(e<=SUNC[i][0]){const t=(e-SUNC[i-1][0])/(SUNC[i][0]-SUNC[i-1][0]),a=hx(SUNC[i-1][1]),b=hx(SUNC[i][1]);return a.map((v,k)=>Math.round(v+(b[k]-v)*t))}return hx('#fff6d8')}
function drawSky(now){const clear=scene==='sun'||scene==='night'?1:scene==='wind'?.8:0,vis={sun:1,night:1,wind:1,fog:.28,drizzle:.32}[scene]??0;
 const sa=SKY.starF*clear;if(sa>.01)stars.forEach((s,i)=>{if(PARTLY&&i%3)return;const a=(RM?.8:.35+.65*(.5+.5*Math.sin(now/1700+s.p)))*sa*(PARTLY?.45:1);X.fillStyle=`rgba(255,255,255,${a})`;X.fillRect(S(s.nx*W),S(s.ny*H),P,P)});
 const mo=MOON,nA=sm(clamp((-SKY.d-10)/30,0,1));if(mo&&mo.alt>-1&&mo.fr>.03&&vis>0&&(nA>.3||clear>=1)){const ma=(.32+.68*nA)*Math.max(vis,clear)*(PARTLY?.8:1)*clamp((mo.alt+1)/4,0,1);if(ma>.01){const mx=S(pathPt(clamp(mo.f,0,1))[0]),my=S(Math.max(H*.2,altY(mo.alt))),R=8;
  if(nA>.5&&mo.fr>.5){const g=X.createRadialGradient(mx,my,0,mx,my,46);g.addColorStop(0,`rgba(200,215,255,${.12*mo.fr*ma})`);g.addColorStop(1,'rgba(200,215,255,0)');X.fillStyle=g;X.fillRect(mx-46,my-46,92,92)}
  const k=Math.cos(2*Math.PI*mo.phase),wax=mo.phase<.5;X.globalAlpha=ma;for(let yy=-R;yy<R;yy+=2)for(let xx=-R;xx<R;xx+=2){const u=(xx+1)/R,v=(yy+1)/R;if(u*u+v*v>1.02)continue;const t=Math.sqrt(Math.max(0,1-v*v))*k,lit=wax?u>t:u<-t;
   if(lit){X.fillStyle=(hash(xx+20,yy+20)<.18)?'#cfd6e4':'#eef2fa';X.fillRect(mx+xx,my+yy,2,2)}else if(nA>.5){X.fillStyle='rgba(70,82,115,.35)';X.fillRect(mx+xx,my+yy,2,2)}}X.globalAlpha=1}}
 const f=SKY.sunF;if(f>-.02&&f<1.02){const e=clamp(SUNP.alt/40,0,1),c=sunCol(e),x=pathPt(f)[0],y=altY(SUNP.alt),sx=S(x),sy=S(y),gv=vis||.12,wf=wfac();
  const gr=90+70*(1-e),g=X.createRadialGradient(sx,sy,0,sx,sy,gr);g.addColorStop(0,`rgba(${c},${(.16+.22*(1-e))*gv*(1-wf*.5)})`);g.addColorStop(1,`rgba(${c},0)`);X.fillStyle=g;X.fillRect(sx-gr,sy-gr,gr*2,gr*2);
  if(vis>=.25){const dv=vis*(PARTLY&&scene==='sun'?.85:1);X.globalAlpha=dv;if(e>.3&&vis>.8){X.save();X.translate(sx,sy);X.rotate(RM?0:now/8000);X.fillStyle=`rgba(${c},.28)`;for(let i=0;i<8;i++){X.rotate(Math.PI/4);X.fillRect(12,-2,10,4)}X.restore()}
   const r=e<.25?10:8,core=c.map(v=>Math.round(v+(255-v)*.55));X.fillStyle=`rgb(${c})`;X.fillRect(sx-r,sy-r,r*2,r*2);X.fillRect(sx-r-2,sy-r+2,r*2+4,r*2-4);X.fillRect(sx-r+2,sy-r-2,r*2-4,r*2+4);X.fillStyle=`rgb(${core})`;X.fillRect(sx-6,sy-6,8,8);X.globalAlpha=1}}}
function tintScene(){const wf=wfac(),w=SKY.warm*(1-.55*wf),c=SKY.cool*(1-.3*wf);if(w<.01&&c<.01)return;X.save();X.globalCompositeOperation='source-atop';
 if(w>.01){X.fillStyle=SKY.morn?`rgba(255,150,100,${.2*w})`:`rgba(255,110,70,${.24*w})`;X.fillRect(0,0,W,H)}if(c>.01){X.fillStyle=`rgba(24,34,84,${.38*c})`;X.fillRect(0,0,W,H)}X.restore()}
function setPlay(on){playing=on;const b=document.getElementById('play');b.classList.toggle('on',on);b.textContent=on?'❚❚ Pause':'▶ Play day';if(on){simMin=curMin();tod='custom';document.querySelectorAll('#tchips button[data-t]').forEach(x=>x.classList.remove('on'))}}
document.getElementById('play').onclick=()=>setPlay(!playing);
document.getElementById('tsl').oninput=e=>{setPlay(false);tod='custom';simMin=+e.target.value;document.querySelectorAll('#tchips button[data-t]').forEach(x=>x.classList.remove('on'));updTime();if(RM)frame(performance.now())};
setInterval(()=>{autoMin=nyNow();if(!qs.get('date')&&dateMode==='today'){const nk=nyKey(),ok=simDate.getFullYear()+'-'+String(simDate.getMonth()+1).padStart(2,'0')+'-'+String(simDate.getDate()).padStart(2,'0');if(nk!==ok){simDate=parseDate(nk);SEA=seasonOf(simDate);tKey='';gKey='';stars=[];size();render()}}if(tod==='auto'){updTime();if(RM)frame(performance.now())}},30000);
